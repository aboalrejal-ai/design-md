<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="tokens.css">
  <style>
    body { font-family: var(--font-family-0, sans-serif); }
    .btn { background-color: var(--color-primary-0, #000); color: #fff; padding: var(--spacing-0, 8px) var(--spacing-1, 16px); border-radius: var(--border-radius-0, 4px); }
    .card { background-color: #fff; border: 1px solid #ddd; padding: var(--spacing-1, 16px); border-radius: var(--border-radius-1, 8px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <h1>Design System Components</h1>
  <section>
    <h2>Buttons</h2>
    <button class="btn">Primary Button</button>
  </section>
  <section>
    <h2>Cards</h2>
    <div class="card">
      <h3>Card Title</h3>
      <p>Card content using standard spacing and radii.</p>
    </div>
  </section>
</body>
</html>
